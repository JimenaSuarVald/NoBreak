name = "nobreak-cloud"
main = "src/index.js"
compatibility_date = "2025-05-13"
# Account ID añadido para evitar que wrangler intente listar cuentas con cada
# comando (operación que requiere permiso "User Details: Read" que el API
# token actual no tiene). Sólo evita la llamada extra — los permisos del token
# real determinan qué puedes hacer.
account_id = "f4041e5549fb184fff60597788099564"

# Binding a la D1 creada con `wrangler d1 create nobreak-db`. Dentro del
# Worker se accede como env.nobreak_db (prepare, bind, run, etc).
[[d1_databases]]
binding = "nobreak_db"
database_name = "nobreak-db"
database_id = "54d9c97a-1229-49d6-bf46-765f8f21263a"

# Bucket R2 que aloja el instalador NoBreak-Setup.exe (stub ~1 MB) + su
# payload comprimido NoBreak-*.nsis.7z (~50 MB). Se sirven a través de la
# ruta `/install/<archivo>` del Worker. El nsis-web del .exe está
# configurado para pedir el payload desde esta misma URL.
[[r2_buckets]]
binding = "nobreak_installer"
bucket_name = "nobreak-installer"

# Static assets (fase 4 paso 1): el Worker sirve la carpeta Frontend/ del
# repo. Cloudflare comprueba primero si el path coincide con un fichero
# estático y lo devuelve; si no coincide, ejecuta el fetch handler del
# Worker (la API en src/index.js). Por eso ya no hace falta el HTML inline
# en handleHomeHtml — Frontend/index.html lo sustituye.
[assets]
directory = "../Frontend"

# CORS y autenticación las gestionamos en JS — sin secretos por ahora.
# Si en el futuro queremos firmar tokens JWT con un secreto, usaremos:
#   wrangler secret put JWT_SIGNING_KEY
