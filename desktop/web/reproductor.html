<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoBreak · Reproductor</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body class="app-shell">

    <header class="app-header">
        <a href="menu.html" class="logo-volver">← NoBreak</a>
        <nav class="top-tabs">
            <button class="tab active" data-tab="albums">Álbumes</button>
            <button class="tab" data-tab="artists">Artistas</button>
            <button class="tab" data-tab="genres">Géneros</button>
            <button class="tab" data-tab="playlists">Listas</button>
        </nav>
        <div class="header-tools">
            <button id="btn-toggle-tema" class="boton-circular" title="Cambiar tema">Tema</button>
            <button id="btn-logout" class="boton-menu">Salir</button>
            <input type="search" id="search" placeholder="Buscar…" autocomplete="off">
        </div>
    </header>

    <main class="app-main">
        <section id="album-grid" class="album-grid"></section>
    </main>

    <!-- Artist description strip (Wikipedia / Last.fm). Hidden until a song is playing. -->
    <div id="artist-strip" class="artist-strip oculto">
        <div class="ai-thumb" id="ai-thumb"></div>
        <div class="ai-body">
            <div class="ai-name" id="ai-name"></div>
            <div class="ai-extract" id="ai-extract"></div>
            <div class="ai-links">
                <a class="ai-link" id="ai-link-wp"  href="#" target="_blank" rel="noopener">Wikipedia</a>
                <a class="ai-link" id="ai-link-lf"  href="#" target="_blank" rel="noopener">Last.fm</a>
                <a class="ai-link" id="ai-link-rym" href="#" target="_blank" rel="noopener">RateYourMusic</a>
                <span class="ai-source" id="ai-source"></span>
            </div>
        </div>
        <button class="ai-toggle" id="ai-toggle" title="Expandir">▾</button>
    </div>

    <footer class="now-playing">
        <div class="np-cover" id="np-cover"></div>
        <div class="np-info">
            <div class="np-title" id="np-title">Selecciona una canción</div>
            <div class="np-meta" id="np-meta"></div>
        </div>
        <div class="np-controls">
            <button id="btn-prev" class="boton-circular" title="Anterior">Ant</button>
            <button id="btn-next" class="boton-circular" title="Siguiente">Sig</button>
        </div>
        <audio id="audio" controls preload="metadata"></audio>
    </footer>

    <!-- Add-to-playlist popover -->
    <div id="add-popover" class="popover oculto" role="menu" aria-label="Añadir a playlist"></div>

    <script src="api.js"></script>
    <script src="library.js"></script>
</body>
</html>
