<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No Break</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header>
        <div class="contenedor-herramientas">
            <button id="btn-toggle-tema" class="boton-circular" title="Cambiar tema">Tema</button>

            <div class="menu-desplegable">
                <button class="boton-menu" id="btn-usuario">Cuenta</button>
                <div class="contenido-desplegable" id="panel-usuario">
                    <div id="auth-tabs">
                        <h3 style="margin-top:0;">Iniciar sesión</h3>
                        <p style="font-size:0.85rem; opacity:0.7; margin:0 0 12px;">
                            Usa las mismas credenciales que en
                            <strong>NoBreak Player</strong> para tu PC.
                        </p>
                        <form id="form-login" class="auth-form">
                            <div id="error-login" class="mensaje-error"></div>
                            <input type="text" id="login-user"
                                   autocomplete="username"
                                   placeholder="Usuario">
                            <input type="password" id="login-pass"
                                   autocomplete="current-password"
                                   placeholder="Contraseña">
                            <button type="submit" class="boton-accion">Entrar</button>
                        </form>
                    </div>
                    <div id="usuario-emparejado" class="oculto">
                        <p>Sesión activa con el servidor</p>
                        <a href="reproductor.html" class="boton-accion" style="display:block; text-align:center; text-decoration:none;">Ir al reproductor</a>
                        <button id="btn-logout" class="boton-accion secondary">Cerrar sesión</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="contenedor-central">
        <h1 class="titulo">No Break</h1>
        <div style="display:flex; flex-direction:column; gap:20px; align-items:center;">
            <a href="reproductor.html" class="enlace-reproductor">Acceder al reproductor web</a>
            <a href="descargable.html" class="enlace-reproductor" style="border-style:dashed; opacity:0.9;">
                Descargar App
            </a>
        </div>
    </main>

    <script src="api.js"></script>
    <script src="javascript.js"></script>
</body>
</html>
